name: CI - Novaes CRM IA

on:
  push:
    branches:
      - main
      - feat/dashboard-image-to-nextjs
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (clean install)
        run: npm ci --no-audit --no-fund
      - name: Agent unit tests
        run: npm run test:agent
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
